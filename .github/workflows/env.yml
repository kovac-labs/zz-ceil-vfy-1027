name: envprobe
on:
  pull_request:
  merge_group:
jobs:
  envarm:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: probe-with-environment
        env:
          S: ${{ secrets.ENVCTL }}
        run: |
          echo "WHICH=envarm event=${{ github.event_name }} ref=$GITHUB_REF"
          echo "ENVARM-POPULATED=$([ -n "$S" ] && echo true || echo false)"
          echo "ENVARM-LEN=${#S}"
          echo "ENVARM-SHA256=$(printf '%s' "$S" | sha256sum | cut -d' ' -f1)"
          echo "NEGCTL-UNSET=[${UNSET_SECRET}]"
        # UNSET_SECRET intentionally never defined -> empty, the in-run negative control
  noenv:
    runs-on: ubuntu-latest
    steps:
      - name: probe-without-environment
        env:
          S: ${{ secrets.ENVCTL }}
        run: |
          echo "WHICH=noenv event=${{ github.event_name }} ref=$GITHUB_REF"
          echo "NOENV-POPULATED=$([ -n "$S" ] && echo true || echo false)"
          echo "NOENV-LEN=${#S}"
          echo "NOENV-SHA256=$(printf '%s' "$S" | sha256sum | cut -d' ' -f1)"
